[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplayerd"
version = "0.1.0.dev0"
description = "Application and control daemon for McPlayer."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["mcplayerd*"]