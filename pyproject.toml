[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplayerd"
version = "0.7.0"
description = "Application and control daemon for McPlayer."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-mpd2>=3.0.3,<4",
    "evdev>=1.7,<2"
]

[tool.setuptools.packages.find]
include = ["mcplayerd*"]